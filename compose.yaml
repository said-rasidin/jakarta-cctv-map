services:
  cctv-map:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
      args:
        NEXT_PUBLIC_ENABLE_CCTV_AI: "true"
        AI_MODEL_VARIANT: ${AI_MODEL_VARIANT:-all}
        AI_MODEL_PRECISION: ${AI_MODEL_PRECISION:-all}
        AI_MODEL_IMAGE_SIZE: ${AI_MODEL_IMAGE_SIZE:-320}
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      CARTO_BASEMAP_API_KEY: ${CARTO_BASEMAP_API_KEY:-}
      CARTO_API_ACCESS_TOKEN: ${CARTO_API_ACCESS_TOKEN:-}
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_ENABLE_CCTV_AI: "true"
    restart: unless-stopped
